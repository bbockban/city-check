[tool.poetry]
name = "proyecto-grado-api"
version = "0.1.0"
description = ""
authors = ["bbockban <bernibocking@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
# Upper bound: ifcopenshell wheels declare python <3.15 (stricter on older releases).
python = ">=3.11,<3.15"
fastapi = "^0.129.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
python-multipart = "^0.0.22"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
python-dotenv = "^1.0.0"
greenlet = "^3.0.0"
httpx = "^0.28.1"
ifcopenshell = "^0.8.0"
pyproj = "^3.7.0"
shapely = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
black = "^26.1.0"
ruff = "^0.8.0"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
# Markdown is not Python; avoid parsing README/docs as code (e.g. fenced ```bash blocks).
exclude = ["README.md", "**/*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"routers/*.py" = ["B008"]  # FastAPI Depends() is safe in function defaults

# Black configuration
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  # docs — Black cannot parse Markdown
  | README\.md
)/
'''

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyproj"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
