databases:
  - name: proyecto-grado-db
    plan: free
    databaseName: proyecto_grado_db
    user: proyecto_grado

services:
  - type: web
    name: proyecto-grado-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proyecto-grado-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Set manually once the frontend is deployed (comma-separated, no trailing slash),
      # e.g. https://proyecto-grado-front.onrender.com
      - key: CORS_ORIGINS
        sync: false
